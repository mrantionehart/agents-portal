# ---------------------------------------------------------------------------
# AP-CI-1 — minimum reliable PR gate for the Agent Portal
#
# This repository had NO CI at all: nothing ran tests, the route-security
# guard only fired as a `prebuild` step on a real build, and pull requests
# merged unverified.
#
# Deliberately NOT here:
#   • `next build` — the app reads Supabase env at module scope, so a build
#     would need real project values. Secrets and provider calls are out of
#     scope for a PR gate.
#   • anything that talks to Supabase, Resend, R2 or DocuSign. Every step
#     below is offline and deterministic.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Jest/Next read nothing real here, but a couple of modules dereference
      # these at import time. Obvious placeholders — NOT secrets, and no
      # request is ever made to them.
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Lockfile-exact install. `npm ci` fails loudly if package.json and
      # package-lock.json have drifted, which is itself worth catching.
      - name: Install (lockfile)
        run: npm ci

      # AP's own route-security guard. It walks app/api/**/route.ts and
      # requires every NEW route to carry an auth marker or an explicit
      # PUBLIC_ROUTE declaration. It is pure static analysis — no env, no
      # network — and until now it only ran via `prebuild`, so a PR could
      # introduce an unguarded route and nothing would say so.
      - name: Route security guard
        run: node scripts/check-api-routes.js

      # The suite. This is the step that executes the training authorization
      # tests (lib/training/__tests__/video-authorization.test.ts).
      - name: Tests
        run: npm test -- --ci --runInBand

      # Typecheck reports but does not gate. The repo's current `tsc --noEmit`
      # status could not be established before this workflow existed — the
      # only machine available could not complete a run — so making it
      # blocking on day one would gate the repo on an unknown. Promote it to
      # blocking once a green run proves it is clean; that is a one-line
      # change (delete continue-on-error).
      - name: Typecheck (non-blocking until a baseline is green)
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true
